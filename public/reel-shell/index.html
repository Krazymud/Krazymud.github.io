<script>
// 整卷的顺序。显影盘里面自己装着照片墙（tray 暗一下进 wall），所以这里算一幕

// 这几幕 iframe 的 load 到了画面还是黑的（模型还在装），等它自己喊 ready 才算装好；喊不出来的话最多等 25 秒

// 整卷的歌：从收音机主持人说完开始，一直放到片尾。客人挑一首或者排几首，按顺序接着放

// 专属设置（服务器 custom.json）里有自己的歌单就用它（文件在客人的 x/）

  {src:'/darkroom/music/satie-gymnopedie-1.mp3',title:'《吉诺佩蒂》第一首 · 萨蒂'},
  {src:'/darkroom/music/debussy-clair-de-lune.mp3',title:'《月光》· 德彪西'},
  {src:'/darkroom/music/chopin-nocturne-op37-1.mp3',title:'《夜曲》作品 37 之 1 · 肖邦'},
];
const q=new URLSearchParams(location.search),BOOT=window.FILM_V||Date.now().toString(36);   // 服务器给了版本号就用它（同一版每次地址一样，浏览器能用存着的）

const veil=document.getElementById('veil'),music=document.getElementById('music');
function load(i){if(i>=SCENES.length)return null;const f=document.createElement('iframe');f.src=SCENES[i]+(SCENES[i].includes('?')?'&':'?')+'b='+BOOT;f.dataset.i=i;f.allow='autoplay';document.body.insertBefore(f,veil);
  const ok=()=>{if(!f.dataset.ready){f.dataset.ready=1;f.dispatchEvent(new Event('ready'))}};

  if(f.dataset.ready)go();else f.addEventListener('ready',go,{once:true})}
addEventListener('load',()=>{});
function boot(){if(cur===0)try{['aroll.dev','aroll.marks'].forEach(k=>sessionStorage.removeItem(k))}catch(e){}
  now=load(cur);show(now);preload();warm(cur)}
function preload(force){next=null;if(cur+1>=SCENES.length||(HEAVY.has(cur+1)&&!force))return;next=load(cur+1)}
const loaded=f=>f.dataset.ready?wait(0):new Promise(r=>f.addEventListener('ready',r,{once:true}));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const tween=(el,css,ms,ease='ease')=>new Promise(r=>{el.style.transition=Object.keys(css).map(k=>`${k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())} ${ms}ms ${ease}`).join(',');setTimeout(()=>{Object.assign(el.style,css);setTimeout(r,ms)},30)});
// ---- 转场：上一幕自己演完它那一段（灯灭、袋子倒、书合上……），喊 done 的时候带一个 fx，这边负责最后接过去 ----
const FX={
  // 烧穿：片子卡在片门里被灯烤化——中间先起一个泡，一个不规则的洞往外烧开，洞边一圈白热、一圈橙、一圈焦黑，再外面一圈烤黄；
  // 洞里露出的就是下一幕。上一幕用一张低清的遮罩一帧帧挖掉，洞边的火画在最上面一层
  async burn(a,b){const GW=640,GH=400;
    show(b);a.style.zIndex=3;b.style.zIndex=2;
    let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;const N=64,G=new Float32Array(N*N).map(rnd);
    const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),g=(i,j)=>G[((j%N+N)%N)*N+((i%N+N)%N)];
      return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v};
    const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1,y*2.1)*.28+vn(x*4.3,y*4.3)*.17;
    // 形状：离中心的远近 + 起伏 + 细碎的泡；画面越宽，洞的轮廓越密（大屏上不会是几个大圆鼓包）
    const F=new Float32Array(GW*GH),cx=.52,cy=.48,asp=GW/GH;
    for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const x=i/GW,y=j/GH,dx=(x-cx)*asp,dy=y-cy;
      F[j*GW+i]=Math.hypot(dx,dy)/1.05+(fbm(x*7,y*7)-.5)*.34+(fbm(x*30,y*30)-.5)*.06}
    const mk=()=>{const c=document.createElement('canvas');c.width=GW;c.height=GH;return c};
    const fire=mk(),mask=mk();fire.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:9;pointer-events:none';document.body.appendChild(fire);
    const fx=fire.getContext('2d'),mx=mask.getContext('2d'),fi=fx.createImageData(GW,GH),mi=mx.createImageData(GW,GH),fd=fi.data,md=mi.data;
    const t0=performance.now(),DUR=window.BURN_DUR||2100,E=.003,sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
    await new Promise(done=>{(function step(){const u=Math.min(1,(performance.now()-t0)/DUR),T=-.04+Math.pow(u,2.1)*1.5,fl=performance.now()/80;
      for(let k=0;k<F.length;k++){const d=F[k]-T,o=k*4;let R=0,Gc=0,B=0,A=0;
        if(d<0){R=255;Gc=246;B=226;A=255}                                                   // 洞里：放映灯的白光
        else if(d<.008){const w=d/.008,f=.88+.12*Math.sin(fl*1.3+(k%GW)*.05+Math.floor(k/GW)*.07);R=255;Gc=(214-120*w)*f;B=(120-110*w)*f;A=255}  // 白热到橙
        else if(d<.02){const w=sm(.008,.02,d);R=120*(1-w)+38*w;Gc=36*(1-w)+18*w;B=8;A=255}     // 焦褐
        else if(d<.07){const w=(d-.02)/.05;R=70;Gc=36;B=10;A=(1-w)*(1-w)*120}                 // 烤黄的一圈
        fd[o]=R;fd[o+1]=Gc;fd[o+2]=B;fd[o+3]=A;md[o+3]=255*sm(-E,E*.5,d)}
      fx.putImageData(fi,0,0);mx.putImageData(mi,0,0);const url=mask.toDataURL();
      a.style.webkitMaskImage=a.style.maskImage=`url(${url})`;a.style.webkitMaskSize=a.style.maskSize='100% 100%';
      u<1?setTimeout(step,33):done()})()});
    // 整格都烧穿了，满屏是灯光；白光慢慢退下去，下一幕从光里出来
    a.classList.remove('on');a.style.maskImage=a.style.webkitMaskImage='';
    await tween(fire,{opacity:0},1100,'ease-out');fire.remove();b.style.zIndex=''},
  // 光圈：老电影收尾那样，四周的黑往里收成一个小亮圆，亮圆抖两下合上；换幕，再从中间张开
  async iris(a,b){const ir=document.createElement('div');ir.style.cssText='position:fixed;inset:0;z-index:9;pointer-events:none;background:#040302';document.body.appendChild(ir);

  // 黑场：暗下去，停一拍，再亮

  // 镜头往下摇：上一幕往上走出画面，下一幕从下面接上来
  async pan(a,b){b.style.transform='translateY(100%)';show(b);b.style.transform='translateY(100%)';
    await wait(30);
    const e='cubic-bezier(.6,0,.25,1)';tween(a,{transform:'translateY(-100%)'},1600,e);await tween(b,{transform:'translateY(0%)'},1600,e);a.classList.remove('on')},

};
// ---- 闲时先下（11.02）：前面几幕放着、网空着的时候，把后面三个大场景要的文件悄悄下进浏览器缓存 ----

    // 片头起：胶卷那幕

    // 清单起：暗房（第 4 卷都可能被圈，八张都下）
    {at:3,to:5,list:()=>[...['tray-lt.js','tray-lt-dive.js','tray-lt-flow.js'].map(js),...['col','nor_gl','rough'].map(k=>`img/steel/steel_${k}.jpg`),...C.rolls[3].frames.map(P)]},

let fadeT,fading=false,hushed=false;const fadeT0=()=>fading;function fade(to,ms){clearInterval(fadeT);fading=true;const from=music.volume,t0=performance.now();fadeT=setInterval(()=>{const u=Math.min(1,(performance.now()-t0)/ms);music.volume=from+(to-from)*u;if(u>=1){clearInterval(fadeT);fading=false;if(to===0)music.pause()}},40)}
addEventListener('message',e=>{const d=e.data;if(!d||!d.roll)return;
  // 只听正在演的这一幕（和它里面套着的照片墙）喊 done；后台预加载的、已经演完的幕喊了不算，免得一下跳到片尾
  const fromNow=now&&(e.source===now.contentWindow||(e.source&&e.source.parent===now.contentWindow));

  else if(d.roll==='pola'){polaOn()}

function startReel(){if(window.__reelStarted)return;window.__reelStarted=1;boot()}
(function(){
  const needVault = new URLSearchParams(location.search).has('vault') || new URLSearchParams(location.search).has('embed');
  if(!needVault){startReel();return}
  if(window.CONTENT && window.CONTENT.__vault){startReel();return}
  const t0=Date.now();
  const tick=()=>{
    try{
      if(window.CONTENT && window.CONTENT.__vault){startReel();return}
      const raw=sessionStorage.getItem('reel-vault-content');
      if(raw){
        const data=JSON.parse(raw);
        if(data){window.CONTENT=data;if(data.__lang)window.ROLL_LANG=data.__lang}
      }
      if(window.CONTENT && window.CONTENT.__vault){startReel();return}
    }catch(e){}
    if(Date.now()-t0>8000){startReel();return}
    setTimeout(tick,50)
  };
  addEventListener('message',e=>{
    const d=e.data;if(!d||d.roll!=='vault-content'||!d.content)return;
    window.CONTENT=d.content;if(d.content.__lang)window.ROLL_LANG=d.content.__lang;startReel()
  });
  tick();
})();

{const g=new THREE.Group();const box=new THREE.Mesh(new THREE.BoxGeometry(.9,.6,.4),new THREE.MeshStandardMaterial({color:'#15100d',roughness:.5,metalness:.4}));

const TW=2.5,TD=1.85,TH=.2,TX=LT?.35:.1,TZ=LT?-.75:.45;

  arc(BW-BR,-(BDp-BR),-Math.PI/2);arc(BW-BR,BDp-BR,0);arc(-(BW-BR),BDp-BR,Math.PI/2);arc(-(BW-BR),-(BDp-BR),Math.PI);

  const out=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];out.push(a);const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L>.1){const n=Math.ceil(L/.12);for(let k=1;k<n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2],a[3]])}}}

{const P=perim.length+1,J=prof.length,pos=[],uv=[],idx=[];let pl=0;const plen=[0];for(let i=1;i<P;i++){const a=perim[i-1],b=perim[i%perim.length];pl+=Math.hypot(b[0]-a[0],b[1]-a[1]);plen.push(pl)}
 const vlen=[0];for(let j=1;j<J;j++)vlen.push(vlen[j-1]+Math.hypot(prof[j][0]-prof[j-1][0],prof[j][1]-prof[j-1][1]));
 for(let j=0;j<J;j++)for(let i=0;i<P;i++){const p=perim[i%perim.length],[o,y]=prof[j];pos.push(p[0]+p[2]*o,y,p[1]+p[3]*o);uv.push(plen[i],vlen[j])}
 for(let j=0;j<J-1;j++)for(let i=0;i<P-1;i++){const a=j*P+i,b=a+1,c=a+P,d=c+1;idx.push(a,c,b,b,c,d)}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(idx);geo.computeVertexNormals();

 const bg=new THREE.ShapeGeometry(sh);bg.rotateX(Math.PI/2);{const u=bg.attributes.uv;for(let i=0;i<u.count;i++){u.setXY(i,u.getX(i)*.6,u.getY(i)*.6)}}

const LIQ_Y=.13,LO=.03+.14*(LIQ_Y-.03)/(TH-.03)-.004;
const LW=2*(BW+LO),LD=2*(BDp+LO),liqGeo=new THREE.PlaneGeometry(LW,LD,96,72);liqGeo.rotateX(-Math.PI/2);
const liqBase=liqGeo.attributes.position.array.slice();

  x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.beginPath();x.roundRect(0,0,c.width,c.height,r);x.fill();return new THREE.CanvasTexture(c)})();

const liquid=new THREE.Mesh(liqGeo,new THREE.MeshPhysicalMaterial({vertexColors:true,color:'#7a4422',transparent:true,opacity:.42,alphaMap:liqAlpha,roughness:.02,metalness:0,ior:1.33,specularIntensity:1,clearcoat:1,clearcoatRoughness:.02,envMapIntensity:1.8,depthWrite:false}));

const wet=new Uint8Array(NX*NZ);{const rr=BR+LO;for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){const x=-LW/2+i*dX,z=-LD/2+j*dZ,cx=Math.max(Math.abs(x)-(LW/2-rr),0),cz=Math.max(Math.abs(z)-(LD/2-rr),0);wet[j*NX+i]=Math.hypot(cx,cz)<rr-.01&&i>0&&j>0&&i<NX-1&&j<NZ-1?1:0}}

const REST_Q=new THREE.Quaternion().setFromEuler(TONGS_REST.rot),GRIP_Q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(new THREE.Vector3(0,0,1),new THREE.Vector3(1,0,0),new THREE.Vector3(0,1,0)));
// 夹头夹进纸边多深；纸上边那一点（世界坐标）→ 夹子中心该在哪
const BITE=.07,gripCenter=(pr,up,out)=>{out.set(0,PH/2-BITE,0);pr.g.localToWorld(out);out.y+=TL/2-.05+up;return out};
const _c=new THREE.Vector3(),_qa=new THREE.Quaternion();
const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_q=new THREE.Quaternion();
const FLAT=new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,.1)),UP=new THREE.Quaternion().setFromEuler(new THREE.Euler(-.15,0,0)),HANG=new THREE.Quaternion();

// 左手边一摞白相纸，最上面一张红笔写着还剩几张
const STACK_AT=new THREE.Vector3(TX-TW/2-.85,0,TZ+.15);
const stack=new THREE.Group();stack.position.copy(STACK_AT);stack.rotation.y=.14;scene.add(stack);
const sheetM=new THREE.MeshStandardMaterial({color:'#efe9de',roughness:.8});
const layers=[];for(let i=0;i<TOTAL;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(PW,.014,PH),sheetM);l.position.set((Math.random()-.5)*.04,.008+i*.016,(Math.random()-.5)*.04);l.rotation.y=(Math.random()-.5)*.06;l.castShadow=l.receiveShadow=true;stack.add(l);layers.push(l)}
const tagC=document.createElement('canvas');tagC.width=CW2;tagC.height=CH2;const tagT=new THREE.CanvasTexture(tagC);tagT.colorSpace=SRGB;
const tag=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),new THREE.MeshStandardMaterial({map:tagT,roughness:.8}));tag.rotation.x=-Math.PI/2;tag.receiveShadow=true;stack.add(tag);
function paintTag(){const left=TOTAL-taken,x=tagC.getContext('2d');x.drawImage(paperC,0,0);
  if(left>0){x.fillStyle='#c62f24';x.font="400 92px Reenie";{const w=x.measureText(`yours: ${left}`).width;if(70+w>CW2-50)x.font=`400 ${Math.floor(92*(CW2-120)/w)}px Reenie`}x.save();x.translate(70,300);x.rotate(-.08);x.fillText(`yours: ${left}`,0,0);x.restore();
    x.fillStyle='rgba(40,30,20,.5)';x.font="400 18px 'JB Mono'";x.fillText('DARKROOM SEVEN · RC PAPER',60,80)}
  tagT.needsUpdate=true;const top=layers[left-1];tag.visible=left>0;if(top)tag.position.set(top.position.x,top.position.y+.009,top.position.z)}
paintTag();

const hint=document.getElementById('hint'),count=document.getElementById('count');
function say(){const h={idle:hung?'tap the paper for the next one':'tap the paper to start',in:'',dev:'wait for it',ready:'now the tongs',grab:'',lift:'',fly:'',done:'tap a print to read the back'}[phase];
  hint.textContent=TOTAL?h:'nothing developed yet';hint.classList.toggle('gone',(!h&&TOTAL>0)||!ltDone);count.textContent=`${hung} of ${TOTAL} dry`}
window.__ltSay=say;
say();

function takeSheet(){if(phase!=='idle'||taken>=TOTAL)return;
  const top=layers[TOTAL-taken-1];top.visible=false;top.getWorldPosition(_a);
  active=makePrint(QUEUE[taken++]);active.from=_a.clone().setY(_a.y+.02);active.g.position.copy(active.from);active.g.quaternion.copy(FLAT);prints.push(active);
  paintTag();phase='in';active.t=0;say()}
function grabIt(){if(phase!=='ready')return;phase='grab';active.t=0;say()}

// 滴水：一小把水珠循环用
const drops=Array.from({length:14},()=>{const d=new THREE.Mesh(new THREE.SphereGeometry(.018,8,6),new THREE.MeshPhysicalMaterial({color:'#5a2a14',transparent:true,opacity:.75,roughness:.05,clearcoat:1}));d.visible=false;d.userData.v=0;scene.add(d);return d});
let dropT=0,boost=.4,leave=0;
function spawnDrop(p){const d=drops.find(d=>!d.visible);if(!d)return;d.visible=true;d.userData.v=0;d.position.copy(p).add(_a.set((Math.random()-.5)*PW*.8,0,(Math.random()-.5)*.05))}
const tips=[];tongs.traverse(c=>{if(c.material&&c.material.color&&c.material.color.getHexString()==='9e2a1e')tips.push(c)});

// ---- 点 ----
const ray=new THREE.Raycaster(),m=new THREE.Vector2(),fr=document.getElementById('frame');
const local=e=>{const r=fr.getBoundingClientRect();return[(e.clientX-r.left)/k,(e.clientY-r.top)/k]};
const aim=e=>{const [x,y]=local(e);m.set(x/1040*2-1,-(y/694)*2+1);ray.setFromCamera(m,cam)};
const hits=(e,objs)=>{aim(e);return ray.intersectObjects(objs,true).length>0};
const pickPrint=e=>{aim(e);const h=ray.intersectObjects(prints.flatMap(p=>[p.front,p.back]))[0];return h&&h.object.userData.pr};
function what(e){
  if(!ltDone)return null;
  if(looking)return 'back';
  if(phase==='idle'&&taken<TOTAL&&hits(e,[stack]))return 'stack';
  if(phase==='ready'&&(hits(e,[tongs])||pickPrint(e)===active))return 'tongs';
  const p=pickPrint(e);if(p&&p.stage==='hung')return p;return null}
fr.addEventListener('pointermove',e=>{fr.style.cursor=what(e)?'pointer':''});
fr.addEventListener('click',e=>{const w=what(e);
  if(w==='back'){looking.stage='unlook';looking.t=0;looking.flipTo=0;looking=null;say()}
  else if(w==='stack')takeSheet();
  else if(w==='tongs')grabIt();
  else if(w&&w.stage==='hung'){flipped=true;peekEl.classList.remove('on');hint.textContent='tap again to hang it back';hint.classList.remove('gone');looking=w;w.stage='look';w.t=0;w.from=w.g.position.clone();w.fromQ=w.g.quaternion.clone()}});
// 全挂完：桌上红笔 all dry，点了顺着晾绳过去照片墙
const dry=document.getElementById('dry');
// 箭头跟着第一张晾着的照片走（照片会晃、镜头会动）：箭头尖对着它右上角
const peekEl=document.getElementById('peek');let flipped=false;const _pk=new THREE.Vector3();
function placePeek(){const p=prints.find(q=>q.stage==='hung');const want=!!p&&!flipped&&!looking&&!leave&&(phase==='idle'||phase==='done'||phase==='in'||phase==='dev');
  peekEl.classList.toggle('on',want);if(!p)return;_pk.set(PW/2,PH/2,0);p.g.localToWorld(_pk);_pk.project(cam);
  const x=(_pk.x+1)/2*1040,y=(1-_pk.y)/2*694;peekEl.style.left=(x-6)+'px';peekEl.style.top=(y-6)+'px'}
// 照片墙提前在后面装好（透明），转场时淡上来，不黑场也不刷新页面
const wallF=document.createElement('iframe');wallF.className='next';let wallGo=0,cut=0;
// 换片时那一下黑：盖在暗房上面、照片墙下面
const blk=document.createElement('div');blk.style.cssText='position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;will-change:opacity';document.body.appendChild(blk);
// 绳子不吃灯光：最后的红和墙上那根线在暗底上看起来是同一个红
const ROPE=new THREE.Color('#4a3a2c'),RED=new THREE.Color('#d03c2b');
// 从镜头现在站的地方往右走（看片台那条路过来的镜头偏右一点，不能先拽回正中间）
let X0=0;
dry.addEventListener('click',()=>{if(leave)return;leave=.001;X0=cam.position.x;dry.classList.remove('on');hint.classList.add('gone')});

const clock=new THREE.Clock();
const loop=fd=>{const dt=fd||Math.min(clock.getDelta(),.1),t=clock.elapsedTime+=fd||0;
  ripple(t);safe.intensity=150+Math.sin(t*.9)*4;
  const A=active;
  if(A&&phase!=='idle'&&phase!=='done'){A.t+=dt;const u=Math.min(1,A.t/(DUR[phase]||1)),e=ease(u);
    if(phase==='in'){A.g.position.lerpVectors(A.from,IN_AT,e);// 先抬起来越过盘沿（盘沿高 .2，那摞最底下那张起飞最低），再落进药水
      A.g.position.y+=Math.sqrt(Math.sin(u*Math.PI))*.42;A.g.updateMatrixWorld(true);
      // 纸一碰到水面：沿着四条边按下去一圈；之后往前滑的那条边一路推着水
      if(!A.splashed&&A.g.position.y<LIQ_Y){A.splashed=true;pokeOutline(A,-.02)}
      else if(A.splashed&&u<1){_e[0].set(PW/2,0,0);A.g.localToWorld(_e[0]);poke(_e[0].x,_e[0].z,-.006*(1-u),.09)}
      if(u>=1){phase='dev';A.t=0;A.agi=0;pokeOutline(A,-.01);say()}}
    else if(phase==='dev'){const ud=Math.min(1,A.t/devDur());
      // AGITATE GENTLY：隔一会儿在纸边上轻轻晃一下水
      if((A.agi=(A.agi||0)+dt)>1.3){A.agi=0;_e[0].set((Math.random()-.5)*PW,(Math.random()<.5?-1:1)*PH/2,0);A.g.localToWorld(_e[0]);poke(_e[0].x,_e[0].z,-.008,.08)}develop(A,Math.pow(ud,1.3));A.g.position.y=IN_AT.y+Math.sin(t*1.3)*.004;if(ud>=1){phase='ready';say()}}
    else if(phase==='ready'){A.g.position.y=IN_AT.y+Math.sin(t*1.3)*.004}
    // 夹：先张开、转成竖的移到纸上边正上方 → 落下去 → 合拢
    else if(phase==='grab'){if(!A.tFrom){A.tFrom=tongs.position.clone();A.qFrom=tongs.quaternion.clone()}
      if(u<.55){const k=ease(u/.55);gripCenter(A,.35,_c);tongs.position.lerpVectors(A.tFrom,_c,k);tongs.quaternion.slerpQuaternions(A.qFrom,GRIP_Q,k);openTongs(k)}
      else if(u<.8){const k=ease((u-.55)/.25);gripCenter(A,.35*(1-k),_c);tongs.position.copy(_c);tongs.quaternion.copy(GRIP_Q);openTongs(1);
        // 夹头伸进水里那一下
        if(k>.6&&!A.dipped){A.dipped=true;_e[0].set(0,PH/2-BITE,0);A.g.localToWorld(_e[0]);poke(_e[0].x-.03,_e[0].z,-.025,.06);poke(_e[0].x+.03,_e[0].z,-.025,.06)}}
      else{gripCenter(A,0,_c);tongs.position.copy(_c);tongs.quaternion.copy(GRIP_Q);openTongs(1-ease((u-.8)/.2))}
      if(u>=1){openTongs(0);phase='lift';A.t=0;A.from=A.g.position.clone();say()}}
    else if(phase==='lift'){_a.set(A.from.x,1.35,A.from.z-.4);A.g.position.lerpVectors(A.from,_a,e);A.g.quaternion.slerpQuaternions(FLAT,UP,e);
      A.g.updateMatrixWorld(true);gripCenter(A,0,tongs.position);tongs.quaternion.copy(GRIP_Q);
      // 泡在药水里的时候纸自己不反光（反光是水面的事）；一出水，表面那层水膜就亮起来
      A.front.material.clearcoat=A.back.material.clearcoat=Math.min(1,u*3);
      // 纸被提出水面：四条边把水往上带一下，纸底下那块水被吸起来又落回去
      if(!A.pulled&&u>.06){A.pulled=true;pokeOutline(A,.035);poke(A.from.x,A.from.z,.02,.4)}if(!A.lifted&&u>.15){A.lifted=true;develop(A,A.p,true)}
      dropT+=dt;if(dropT>.12&&u>.3){dropT=0;spawnDrop(_b.set(A.g.position.x,A.g.position.y-PH/2,A.g.position.z))}
      if(u>=1){phase='fly';A.t=0;A.from=A.g.position.clone();A.slot=hung}}
    else if(phase==='fly'){_a.set(slotX(A.slot),HANG_Y,LINE_Z+(A.slot%2)*.03);A.g.position.lerpVectors(A.from,_a,e);A.g.scale.setScalar(1-(1-HS)*e);A.g.position.y+=Math.sin(u*Math.PI)*.3;
      A.g.quaternion.slerpQuaternions(UP,HANG,e);A.home=_a.clone();
      if(u>=1){A.stage='hung';addPin(A);hung++;active=null;phase=hung>=TOTAL?'done':'idle';say();if(phase==='done'){setTimeout(()=>dry.classList.add('on'),900);wallF.src='wall.html?v=tnrhqg&from=tray';document.body.appendChild(wallF)}}}}
  // 竹夹子：没在用就回盘沿；该点它的时候红头一呼一吸地亮
  // 松开以后自己张一下再合上、回到盘沿
  if(phase!=='grab'&&phase!=='lift'){tongs.position.lerp(TONGS_REST.pos,Math.min(1,dt*4));tongs.quaternion.slerp(REST_Q,Math.min(1,dt*4))}
  const glowOn=phase==='ready'?.5+.5*Math.sin(t*4):0;tips.forEach(m=>{m.material.emissive.set('#ff5a2a');m.material.emissiveIntensity=glowOn*.9});
  // 那摞纸：轮到点它的时候最上面一张轻轻浮一下
  if(tag.visible){const top=layers[TOTAL-taken-1];if(top)tag.position.y=top.position.y+.009+(phase==='idle'?Math.max(0,Math.sin(t*2.4))*.02:0)}
  // 晾着的：轻轻晃；被点的那张凑到眼前、翻到背面；再点挂回去
  prints.forEach(p=>{
    if(p.stage==='hung'){p.g.rotation.set(Math.sin(t*.6+p.sway)*.03,0,Math.sin(t*.8+p.sway)*.025);
      if((p.wet??1)>0){const w0=p.wet??1;p.wet=Math.max(0,w0-dt/9);if(Math.floor(w0*20)!==Math.floor(p.wet*20)){develop(p,p.p,true);p.front.material.clearcoat=p.wet}}}
    else if(p.stage==='look'){p.t+=dt;const e=ease(Math.min(1,p.t/DUR.look));p.g.scale.setScalar(HS+(1-HS)*e);cam.getWorldDirection(_a);_b.copy(cam.position).addScaledVector(_a,2.9);
      p.g.position.lerpVectors(p.from,_b,e);p.g.quaternion.slerpQuaternions(p.fromQ,cam.quaternion,e);if(e>=1)p.flipTo=1;p.lit=e}
    else if(p.stage==='unlook'){p.t+=dt;const e=ease(Math.min(1,p.t/DUR.look));if(p.t<.35){p.lookPos=p.lookPos||p.g.position.clone();p.lookQ=p.lookQ||p.g.quaternion.clone()}
      else{const e2=ease(Math.min(1,(p.t-.35)/DUR.look));p.g.scale.setScalar(1-(1-HS)*e2);p.g.position.lerpVectors(p.lookPos,p.home,e2);p.g.quaternion.slerpQuaternions(p.lookQ,HANG,e2);if(e2>=1){p.stage='hung';p.lookPos=p.lookQ=null}}}
    if(p.stage==='unlook')p.lit=Math.max(0,(p.lit||0)-dt*1.5);p.front.material.emissiveIntensity=p.back.material.emissiveIntensity=(p.lit||0)*.28;
    p.flip+=(p.flipTo-p.flip)*Math.min(1,dt*5);p.inner.rotation.y=ease(Math.min(1,Math.max(0,p.flip)))*Math.PI});
  drops.forEach(d=>{if(!d.visible)return;d.userData.v+=dt*5;d.position.y-=d.userData.v*dt;if(d.position.y<LIQ_Y){d.visible=false;poke(d.position.x,d.position.z,-.02,.045)}});
  // 点了 all dry：镜头抬起来顺着晾绳往右走，暗下去，进照片墙
  if(leave){leave+=dt/3.6;const u=Math.min(1,leave),e=ease(u),run=X0+u*u*5+Math.max(0,leave-1)*10;
    // 镜头降到晾绳的高度，正对着它往右走，越走越快；绳子慢慢染成红线
    cam.position.set(run,CAM0[0]+(LINE_Y-CAM0[0])*e,CAM0[1]+(LINE_Z+5.6-CAM0[1])*e);_a.copy(LOOK).lerp(_b.set(run,LINE_Y,LINE_Z),e);_a.x=_a.x*(1-e)+run*e;cam.lookAt(_a);
    const red=Math.min(1,Math.max(0,(u-.05)/.4));rope.material.color.lerpColors(ROPE,RED,red);
    // 走到快头：灯暗下去一次，照片墙从暗里亮起来。暗和亮都交给浏览器合成层去过渡（主线程忙也不卡）；暗到底这边就停画，力气让给照片墙
    if(u>=.88&&!cut){cut=1;blk.style.transition='opacity .8s ease-in';blk.style.opacity=1;
      setTimeout(()=>{renderer.setAnimationLoop(null);_b.set(run,LINE_Y,LINE_Z).project(cam);
        wallF.contentWindow.postMessage({go:1,x:-20,y:(1-_b.y)/2*694},'*');wallF.classList.add('on');
        wallF.style.transition='opacity .9s ease-out';wallF.style.opacity=1},850)}}
  else cam.lookAt(LOOK);
  placePeek();
  renderer.render(scene,cam)};
// 晾绳上的木夹子
function addPin(p){const pin=new THREE.Mesh(new THREE.BoxGeometry(.06,.2,.06),new THREE.MeshStandardMaterial({color:'#b48a5a',roughness:.7}));pin.position.set(0,PH/2+.02,.03);pin.castShadow=true;p.inner.add(pin)}
// ?done：直接全挂好、all dry 已经写出来，只看转场用
if(new URLSearchParams(location.search).has('done')){
  QUEUE.forEach((q,j)=>{const p=makePrint(q);develop(p,1);p.slot=j;p.home=new THREE.Vector3(slotX(j),HANG_Y,LINE_Z+(j%2)*.03);p.g.position.copy(p.home);p.g.scale.setScalar(HS);p.wet=0;p.stage='hung';addPin(p);prints.push(p)});
  layers.forEach(l=>l.visible=false);taken=hung=TOTAL;paintTag();phase='done';say();dry.classList.add('on');wallF.src='wall.html?v=tnrhqg&from=tray';document.body.appendChild(wallF)}
renderer.setAnimationLoop(()=>loop());
// 看片台的脚本都到了、第一帧画出来了才告诉壳子可以亮
setTimeout(()=>ROLL.ready(),120);
// 面板收起来时 rAF 会停，测试用：__tray.step(帧数)
window.__tray={cam,LOOK,step:n=>{for(let i=0;i<n;i++)loop(1/30)},state:()=>({phase,taken,hung,TOTAL,looking:!!looking}),what:(x,y)=>{const w=what({clientX:x,clientY:y});return w&&(w.stage||w)},pp:()=>prints.map(p=>p.stage+':'+p.g.position.toArray().map(v=>v.toFixed(2)).join(','))};
</script>

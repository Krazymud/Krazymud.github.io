<script type="module">

const s=document.getElementById('stage');
const fit=()=>{const k=Math.min(innerWidth/1600,innerHeight/1000);s.style.transform=`translate(-50%,-50%) scale(${k})`};fit();addEventListener('resize',fit);

// 书名是客人在入场那一幕用羽毛笔写的；这里先放占位
const Q=new URLSearchParams(location.search);
const TITLE='',BYLINE=CONTENT.book.byline;
// 书的颜色：?c=8a1d1a 这样换（不带 #）
const COLOR='#'+(Q.get('c')||'7a2420');
const MOBILE=matchMedia('(pointer:coarse)').matches;

// 一进来就把这一幕要的图和模型同时拿起来（11.02：原来一个拿完才拿下一个，二十多样排着队，第一次打开的人要黑屏等几十秒）
// img() 记住拿过的，后面照旧一句句 await，等的只是已经在路上的那一份
const IMGS=new Map(),img=src=>{if(!IMGS.has(src))IMGS.set(src,ROLL.img(src));return IMGS.get(src)};
const LEATHER=Promise.all(['nor_gl','rough'].map(k=>new THREE.TextureLoader().loadAsync(`img/leather_${k}.jpg`)));
// 客人写的中文也等字体到了再画进贴图（11.03）
await Promise.all([ROLL.zhReady(),document.fonts.load("italic 800 200px Fraunces"),document.fonts.load("italic 400 42px Fraunces"),document.fonts.load("20px 'JB Mono'"),document.fonts.load("46px 'Courier Prime'"),document.fonts.load("40px Reenie"),document.fonts.load("58px Allura"),document.fonts.load("italic 40px 'Instrument Serif'"),document.fonts.load("700 30px 'Courier Prime'"),document.fonts.load("italic 600 46px Fraunces"),document.fonts.load("34px 'IM Fell'")]);
// 客人调过裁切的照片，先按它在书里那一格的形状裁好（封面卡 4:3、拼贴大 4:3、拼贴小 210:250、电影院银幕 900:560、地图和指南针的拍立得正方形）
const cut=(im,f,a)=>f&&f.crop?CONTENT.cropCanvas(im,f,a,1800):im;
const [photo,feather,ticketImg,cameraImg,envImg]=await Promise.all([img(CONTENT.book.cover.photo).then(im=>cut(im,CONTENT.book.cover,512/384)),img('img/feather.jpg'),img('img/ticket.webp'),img('img/camera.webp'),img('img/env_cafe.jpg')]);
// 皮：Poly Haven leather_red_03（CC0）的皮纹法线和粗糙度，颜色自己染
const tl=new THREE.TextureLoader(),[lNor,lRough]=await LEATHER;
// 封面要的都到了，再一起拿后面几页的图和两个模型（11.03：以前一进来就全部一起拿，封面的几张被挤在一堆里）
{const B=CONTENT.book;['img/feather.jpg','img/ticket.webp','img/camera.webp','img/env_cafe.jpg','img/wood.jpg',
  ...'collage/bfly-brown.webp collage/bfly-orange.webp collage/bfly-yellow.webp collage/filmad.jpg collage/greyhound.webp collage/news.jpg collage/seventh-heaven.jpg collage/stamp-ca.jpg collage/stamp-ct.jpg collage/stamp-mi.jpg daisy/daisy-pressed.webp daisy/daisy-sprig.webp daisy/fmn-pressed.webp library/card-1916.jpg library/notice-paper.jpg library/notice-print.png library/pocket-1959.jpg library/stamper.webp map-china-1910.jpg'.split(' ').map(n=>'img/'+n),
  B.cover?.photo,B.theater?.photo,B.compass?.photo,...(B.collage||[]).map(p=>p.photo),...(B.map||[]).map(p=>p.photo)].filter(Boolean).forEach(img)}
const GLTF={compass:new GLTFLoader().loadAsync('models/compass/seadogs_compass_1k.gltf'),proj:new GLTFLoader().loadAsync('models/projector/filmstrip_projector_8mm_1k.gltf')};
for(const t of [lNor,lRough]){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(.6,.8)}

// 卡片在封面上的位置（画布像素），绒毛遮罩要用
const CARD_W=1.2,cardPx={w:CARD_W/BW*CW,h:CARD_W*SH/SW/BD*CH,y:540};cardPx.x=(CW-cardPx.w)/2;
const tex=coverTextures({title:TITLE,byline:BYLINE,color:COLOR,card:cardPx});

const cv=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(ROLL.pr());renderer.setSize(1040,694,false);ROLL.onQuality(()=>{renderer.setPixelRatio(ROLL.pr());renderer.setSize(1040,694,false)});
renderer.shadowMap.enabled=true;
// 影子不每帧重画：只在灯、纸、羽毛笔、桌上东西在动的时候才画（镜头动不用重画影子）
renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
const scene=new THREE.Scene();scene.background=new THREE.Color('#1a110a');
const cam=new THREE.PerspectiveCamera(30,1040/694,.1,100);cam.position.set(.4,7.2,5.4);cam.lookAt(.4,0,-.15);
// 桌子照冲印袋那一幕的调法：压暗、做旧、偏巧克力棕，灯只负责亮度
const wimg=await img('img/wood.jpg'),wc=document.createElement('canvas');wc.width=wimg.width;wc.height=wimg.height;
{const x=wc.getContext('2d');x.filter='brightness(.66) sepia(.55) saturate(.95) hue-rotate(8deg) contrast(1.1)';x.drawImage(wimg,0,0);x.filter='none';x.globalCompositeOperation='multiply';x.globalAlpha=.4;x.fillStyle='#6e5028';x.fillRect(0,0,wc.width,wc.height)}
const wood=new THREE.CanvasTexture(wc);wood.colorSpace=THREE.SRGBColorSpace;wood.wrapS=wood.wrapT=THREE.RepeatWrapping;wood.repeat.set(3,2);
const table=new THREE.Mesh(new THREE.PlaneGeometry(22,15),new THREE.MeshStandardMaterial({map:wood,color:'#ffffff',roughness:.85}));
table.rotation.x=-Math.PI/2;table.receiveShadow=true;scene.add(table);
// 整个房间的光：一张暖色咖啡馆全景（Poly Haven comfy_cafe，CC0，缩成 1024 宽），再往暖里压一层；
// 皮面、纸、桌子都会带上很淡的房间反光，这是不像 CG 最要紧的一步
{const ec=document.createElement('canvas');ec.width=envImg.width;ec.height=envImg.height;const x=ec.getContext('2d');x.drawImage(envImg,0,0);x.globalCompositeOperation='multiply';x.fillStyle='#ffc890';x.fillRect(0,0,ec.width,ec.height);
 const et=new THREE.CanvasTexture(ec);et.colorSpace=THREE.SRGBColorSpace;et.mapping=THREE.EquirectangularReflectionMapping;
 const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(et).texture;pm.dispose()}
scene.add(new THREE.AmbientLight('#ffd6a8',.03));
// 两盏光：入场时亮在信纸上，书在旁边暗着但看得见；?light=book 看灯转到书上之后
const LIGHT=Q.get('light')||'paper',PAPER=new THREE.Vector3(-1.3,0,.2),BOOK=new THREE.Vector3(1.15,0,-.1);
const spot=(target,on)=>{const l=new THREE.SpotLight('#ffd29c',on?105:9,30,.5,1,2);l.position.set(target.x-1.6,6.5,target.z+1.3);l.target.position.copy(target);
  l.castShadow=true;l.shadow.mapSize.set(1024,1024);l.shadow.radius=6;l.shadow.bias=-.0003;scene.add(l,l.target);return l};
const lampPaper=spot(PAPER,LIGHT==='paper'),lampBook=spot(BOOK,LIGHT==='book');

const fill=new THREE.PointLight('#ffc890',1.1,10,2);fill.position.set(2.6,1.8,2.4);scene.add(fill);

const threads=makeBook(tex,0,{nor:lNor,rough:lRough},COLOR),{book,TOP}=threads;book.rotation.y=-.08;book.position.copy(BOOK);scene.add(book);
const L=makeLetter(1.7);L.mesh.position.set(PAPER.x,.004,PAPER.z);L.mesh.rotation.z=.08;scene.add(L.mesh);
const qq=makeQuill(2.0,feather);qq.position.set(PAPER.x+.25,.04,PAPER.z+.15);qq.rotation.y=-.9;scene.add(qq);
{const n=makeNotes();n.position.set(2.75,0,-1.95);n.rotation.y=-.1;scene.add(n);
 const tk=makeTicket(ticketImg,1.4);tk.position.set(2.3,.026,-1.2);tk.rotation.z=.3;scene.add(tk)}
{const cm=makeCamera(cameraImg,.8);cm.position.set(-2.3,0,1.55);cm.rotation.y=.4;scene.add(cm)}
const card=makeCard(photo,CARD_W);card.group.position.set(0,TOP,-BD/2+(cardPx.y+cardPx.h/2)/CH*BD);book.add(card.group);

// ---- 白耳机：卷成松松的一小团放在桌子左上角，两只耳机从团里伸出来 ----
const white=new THREE.MeshPhysicalMaterial({color:'#f4f1ec',roughness:.32,clearcoat:.7,clearcoatRoughness:.2});
const cw=.016,V=(x,y,z)=>new THREE.Vector3(x,y,z),EC=V(-2.1,0,-1.55);
const tube=(pts,n)=>{const c=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.4);const m=new THREE.Mesh(new THREE.TubeGeometry(c,n,cw,8,false),white);m.castShadow=m.receiveShadow=true;scene.add(m);return c};
// 一圈压一圈：每一圈稍微小一点、高一点点，叠着不穿模
const coil=[];for(let i=0;i<=40;i++){const a=i/40*Math.PI*2*2.1+.4,r=.3-i*.0028;coil.push(V(EC.x+Math.cos(a)*r*1.15,cw+i*.0009,EC.z+Math.sin(a)*r*.85))}
const last=coil[coil.length-1];
const main=tube([...coil,V(last.x+.25,cw,last.z+.3),V(last.x+.65,cw,last.z+.62),V(last.x+.95,cw,last.z+.7)],380);
const side=tube([coil[30],V(coil[30].x-.08,cw+.025,coil[30].z-.08),V(coil[30].x-.2,cw,coil[30].z-.22),V(coil[30].x-.26,cw,coil[30].z-.38)],120);
{const r=new THREE.Mesh(new THREE.CapsuleGeometry(.03,.14,6,12),white);const u=.6;r.position.copy(main.getPointAt(u));r.position.y=cw+.02;r.quaternion.setFromUnitVectors(V(0,1,0),main.getTangentAt(u));r.castShadow=true;scene.add(r)}
// 耳机：柄的尾巴就是线头，柄往前长出去，头微微翘起来
const bud=curve=>{
  const p=curve.getPointAt(1),t=curve.getTangentAt(1).setY(0).normalize();
  const outer=new THREE.Group(),inner=new THREE.Group();
  const stem=new THREE.Mesh(new THREE.CapsuleGeometry(.03,.2,6,12),white);stem.rotation.z=-Math.PI/2;stem.position.x=.13;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.1,32,20),white);head.scale.set(1,.75,1.05);head.position.x=.33;
  const grill=new THREE.Mesh(new THREE.CircleGeometry(.045,24),new THREE.MeshStandardMaterial({color:'#6f6862',roughness:.6}));grill.rotation.x=-Math.PI/2;grill.position.set(.35,.076,0);
  stem.castShadow=head.castShadow=true;inner.add(stem,head,grill);inner.rotation.z=.15;inner.position.y=.012;
  outer.add(inner);outer.position.copy(p);outer.rotation.y=Math.atan2(-t.z,t.x);scene.add(outer)};
bud(main);bud(side);

// 平平的纸片、细细的耳机线不投影：影子几乎看不出来，却让每次画影子都慢一截
scene.traverse(o=>{if(o.isMesh&&(o.geometry.type==='TubeGeometry'||(o.geometry.type==='PlaneGeometry'&&o.parent!==qq.children[0])))o.castShadow=false});
// 房间反光只要淡淡一层
scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>{if("envMapIntensity" in m)m.envMapIntensity=.2})});
// ---- 写书名 ----
// 1 进来：全景，灯照着信纸，红字提示点信纸
// 2 点了：镜头推过去，信纸在画面正中；纸上自己写着怎么做，客人打字，羽毛笔跟着字尾走
// 3 回车：镜头转到书上，灯跟过去，路上书名一针一针绣好
const inp=document.getElementById('ttl'),hint=document.getElementById('hint');
qq.updateMatrixWorld(true);
// 羽毛笔按笔尖来摆：写字的时候像被手拿着，笔尖贴纸、羽毛往上翘，不会钻到书底下
const nibW=new THREE.Vector3();qq.traverse(o=>{if(o.geometry?.type==='ConeGeometry')o.getWorldPosition(nibW)});
const nibLocal=qq.worldToLocal(nibW.clone()),curNib=nibW.clone();let nibGoal=null,tilt=0,tiltGoal=0;qq.rotation.order='YXZ';
const qHome=qq.position.clone(),nibHome=nibW.clone();
const onPaper=(u,v)=>L.mesh.localToWorld(new THREE.Vector3((u-.5)*L.w,(.5-v)*L.h,0));
// 三个机位：全景 / 信纸居中 / 书居中（推近一点就好，不用贴脸）
const SHOT={wide:{p:cam.position.clone(),l:new THREE.Vector3(.4,0,-.15)},
  letter:{p:new THREE.Vector3(PAPER.x+.15,4.6,PAPER.z+3.0),l:new THREE.Vector3(PAPER.x+.1,0,PAPER.z-.05)},
  book:{p:new THREE.Vector3(BOOK.x+.05,5.0,BOOK.z+3.3),l:new THREE.Vector3(BOOK.x,.25,BOOK.z-.05)}};
let move=null;const look=SHOT.wide.l.clone();
const goShot=(name,ms)=>{move={from:{p:cam.position.clone(),l:look.clone()},to:SHOT[name],t0:performance.now(),ms}};
let stage='wide',writing=false,sealedAt=0,stitches=null,si=0,plan=null,prep=0,bumpDone=false,blinkAt=0,caret=false;
hint.textContent='tap the letter';
// 书名那一条小平面开场就放好（空的透明图），着色器和贴图先编译上传，回车时只换图，不会半路卡一下
const blankCol=mk2(CW/2,TITLE_H/2),blankBump=mk2(CW/2,TITLE_H/2);
const titleTex=new THREE.CanvasTexture(blankCol);titleTex.colorSpace=THREE.SRGBColorSpace;titleTex.anisotropy=8;const titleBump=new THREE.CanvasTexture(blankBump);
const titlePlane=(()=>{const tp=new THREE.Mesh(new THREE.PlaneGeometry(BW,BD*TITLE_H/CH),new THREE.MeshStandardMaterial({map:titleTex,bumpMap:titleBump,bumpScale:3,roughness:.45,transparent:true,depthWrite:false}));
 tp.rotation.x=-Math.PI/2;tp.position.set(0,TOP+.005,-BD/2+(TITLE_Y0+TITLE_H/2)/CH*BD);book.add(tp);return tp})();
function mk2(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const draw=()=>{const e=L.write(inp.value,writing&&caret);return e};
// 书名按占地方算长短：中日韩字一个算两格，其它一个算一格，最多 24 格（大约英文 24 个字母、中文 12 个字）
const MAXU=24,units=s=>[...s].reduce((n,ch)=>n+(/[⺀-鿿가-힯＀-￯]/.test(ch)?2:1),0);
const clip=s=>{let out='',n=0;for(const ch of s){const u=units(ch);if(n+u>MAXU)break;out+=ch;n+=u}return out};
let tooLongAt=0,composing=false;
// 有中文先把两套中文字体拿到（字体到了再画，不然第一下会是电脑自带的字）

// 中文输入法还在拼的时候先不剪，等字选好了再算
const typed=()=>{if(!writing)return;const s=composing?inp.value:clip(inp.value);if(s!==inp.value){inp.value=s;
    // 写满了：红铅笔在下面轻轻提醒一句

// 串成一卷时：书合上、台灯灭了以后，底下并排两句：read it again 再读一遍 / roll the credits → 去片尾。每次合上都有这两个选择，点别处不算
